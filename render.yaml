services:
  - type: web
    name: vivariaos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed
    startCommand: gunicorn thanish_web_project.wsgi --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: MONGO_URI
        sync: false   # paste your Atlas connection string in the Render dashboard
      - key: MONGO_DB
        value: vivaria
      - key: PYTHON_VERSION
        value: "3.12.7"
